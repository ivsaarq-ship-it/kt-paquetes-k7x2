<!doctype html>
<html lang="es">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalli Terraza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap">
<style id="kalli-css">
:root{
  --bg:#F1F4EE;--surface:#FFFFFF;--surface-2:#E7ECE5;
  --ink:#17221C;--ink-2:#46564D;--ink-3:#5E6F65;--line:#D3DCD2;
  --night:#173026;--night-2:#22402F;--night-ink:#EEF3EC;--night-mute:#A7BDB0;--string:#6A8B79;
  --gold:#E09A2E;--gold-ink:#2A1904;--gold-soft:#FAEBD3;--gold-line:#E4BE84;
  --agave:#2B6A58;--agave-soft:#DCEAE3;
  --busy:#A23F2C;--busy-soft:#F3E1DB;
  --danger:#A8412E;--danger-ink:#FFFFFF;
  --wa:#1C874A;--wa-ink:#FFFFFF;
  --toast-bg:#17221C;--toast-ink:#F1F4EE;
  --r:14px;--r-sm:10px;
  --f-display:'Gloock',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512;--surface:#16211B;--surface-2:#1D2A23;
    --ink:#E6EEE8;--ink-2:#B1C1B7;--ink-3:#85978C;--line:#2B3C32;
    --night:#0A1410;--night-2:#15251C;--night-ink:#EEF3EC;--night-mute:#98AEA1;--string:#4C6A5A;
    --gold:#EDAA45;--gold-ink:#231402;--gold-soft:#35280F;--gold-line:#7A5C2A;
    --agave:#82C4AC;--agave-soft:#193128;
    --busy:#E68A74;--busy-soft:#3B211B;
    --wa:#2FA863;--wa-ink:#04190C;
    --toast-bg:#E6EEE8;--toast-ink:#0E1512;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#16211B;--surface-2:#1D2A23;
  --ink:#E6EEE8;--ink-2:#B1C1B7;--ink-3:#85978C;--line:#2B3C32;
  --night:#0A1410;--night-2:#15251C;--night-ink:#EEF3EC;--night-mute:#98AEA1;--string:#4C6A5A;
  --gold:#EDAA45;--gold-ink:#231402;--gold-soft:#35280F;--gold-line:#7A5C2A;
  --agave:#82C4AC;--agave-soft:#193128;
  --busy:#E68A74;--busy-soft:#3B211B;
  --wa:#2FA863;--wa-ink:#04190C;
  --toast-bg:#E6EEE8;--toast-ink:#0E1512;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--agave)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}

/* aviso de prueba */
.demo{background:var(--gold-soft);color:var(--ink);text-align:center;font-size:.8rem;font-weight:600;padding:6px 16px}

/* encabezado */
.top{background:var(--night);color:var(--night-ink);padding-top:16px}
.brand-row{display:flex;flex-direction:column;gap:10px}
.brand-top{display:flex;align-items:center;gap:12px}
.brand-logo{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
.brand-mark{flex:none;height:92px;width:auto;display:block}
@media (min-width:480px){.brand-mark{height:112px}}
.brand-btns{display:flex;flex-direction:row;justify-content:flex-end;align-items:center;gap:8px;flex:none}
.brand-txt{min-width:0;flex:1 1 auto;text-align:center}
.wm{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(1.3rem,7vw,1.9rem);line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;margin-top:6px;font-size:.76rem;letter-spacing:.03em;text-transform:none;color:var(--night-mute)}
.brand small.ciudad{white-space:nowrap}
.adm-btn{flex:none;background:transparent;color:var(--night-ink);border:1px solid var(--string);border-radius:999px;padding:7px 14px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.adm-btn:hover{border-color:var(--gold)}
.festoon{display:block;width:100%;height:auto;margin-top:8px}
.festoon path{fill:none;stroke:var(--string);stroke-width:1}
.festoon line{stroke:var(--string);stroke-width:1}
.festoon .bulb{fill:var(--gold);animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.festoon .bulb{animation:none}}
.steps{list-style:none;margin:0;padding:8px 0 14px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st{width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--night-mute);font:inherit;font-size:.74rem;font-weight:600;padding:4px 0;cursor:pointer}
.st-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem;font-variant-numeric:tabular-nums}
.st.done{color:var(--night-ink)}
.st.done .st-n{background:var(--night-2);border-color:var(--gold-line)}
.st.now{color:var(--gold)}
.st.now .st-n{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.st:disabled{opacity:.45;cursor:default}

/* estructura */
main{padding-block:22px calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:24px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,7.5vw,2.6rem);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.intro-sm h1{font-size:clamp(1.7rem,6vw,2.1rem)}
.intro p{margin:0;color:var(--ink-2);max-width:54ch}
.block h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.15;margin:0 0 12px;text-wrap:balance}
details.cat{padding:0;border:0}
details.cat>summary{list-style:none;color:inherit;font-weight:inherit;font-size:inherit;padding-block:0;display:flex;align-items:center;cursor:pointer}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary h2{display:flex;align-items:center;gap:8px;flex:1;margin:0}
details.cat>summary h2::after{content:'';width:11px;height:11px;margin-left:auto;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.cat[open]>summary h2::after{transform:rotate(45deg)}
details.cat>.items{margin-top:12px}
.cat-badge{font-size:.72rem;font-weight:700;color:var(--ink);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:2px 9px;font-family:var(--f-body,inherit)}
.cat-nav{margin-top:14px}
.chip.sm{padding:6px 12px;font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;padding-bottom:2px}
.gallery img{width:78vw;max-width:280px;height:180px;object-fit:cover;border-radius:var(--r);flex:none;scroll-snap-align:start;background:var(--surface)}
.mz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(128,128,128,.25)}.mz-row>span{flex:1 1 auto;min-width:0}
.video-kt{display:block;margin:14px auto 0;width:min(100%,300px);aspect-ratio:478/850;object-fit:cover;border-radius:var(--r);background:#000}
.map-embed{position:relative;width:100%;padding-top:56%;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.map-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.plano figure{margin:0}
.plano-svg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.plano-svg svg{display:block;width:100%;height:auto;margin:0 auto}
.plano figcaption{margin-top:8px;font-size:.85rem;color:var(--ink-2)}
.plano text{fill:var(--ink);font-family:var(--f-body)}
.plano text.sub{fill:var(--ink-2)}
.plano text.on-dark{fill:var(--night-ink)}
.plano .floor{fill:var(--bg)}
.plano .wall{fill:none;stroke:var(--ink);stroke-width:.14;stroke-linecap:square}
.plano .open{fill:none;stroke:var(--ink-3);stroke-width:.05;stroke-dasharray:.3 .2}
.plano .dim{stroke:var(--ink-3);stroke-width:.03}
.plano .circ{fill:none;stroke:var(--gold);stroke-width:.11;stroke-dasharray:0 .3;stroke-linecap:round}
.plano .musica{fill:var(--night-2);stroke:var(--string);stroke-width:.04}
.plano .col{fill:var(--ink-2)}
.plano .step{stroke:var(--ink-3);stroke-width:.04}
.plano .huella{fill:var(--ink-3);opacity:.45}
.plano .pista{fill:var(--gold-soft);stroke:var(--gold);stroke-width:.06}
.plano .zona{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:.03}
.plano .toldo{fill:var(--bg);stroke:var(--ink-3);stroke-width:.05;stroke-dasharray:.3 .2}
.plano .mesa .t{fill:var(--agave-soft);stroke:var(--agave);stroke-width:.05}
.plano .mesa .c{fill:var(--agave)}
.plano .mesa.off .t{fill:none;stroke:var(--ink-3);stroke-dasharray:.12 .1}
.plano .mesa.off .c{fill:var(--line)}
.plano .mesa.off text{fill:var(--ink-3)}
.sw-mesa{background:var(--agave-soft);border:1px solid var(--agave)}
.sw-mesa-off{border:1px dashed var(--ink-3)}
.hint{margin:8px 0 0;font-size:.88rem;color:var(--ink-2)}
.ownerbox{border:2px dashed var(--gold-line);background:var(--gold-soft);border-radius:var(--r);padding:14px 16px}
.ownerbox h2{font-size:1.05rem;margin:0 0 6px}
.lbl{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0;font-size:1.05rem;font-weight:700;text-transform:capitalize}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.3rem;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--ink-3);padding-bottom:2px}
.day{aspect-ratio:1/1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--agave-soft);color:var(--ink);font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.day:hover:not(:disabled){border-color:var(--agave)}
.day:disabled{background:transparent;color:var(--ink-3);font-weight:400;cursor:default}
.day.busy{background:var(--busy-soft);color:var(--busy);text-decoration:line-through}
.day.held{background:var(--gold-soft);color:var(--gold-ink);text-decoration:line-through}
.day.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.82rem;color:var(--ink-2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.sw-ok{background:var(--agave-soft);border:1px solid var(--agave)}
.sw-busy{background:var(--busy-soft);border:1px solid var(--busy)}
.sw-held{background:var(--gold-soft);border:1px solid var(--gold)}
.sw-sel{background:var(--gold)}
.quick{margin-bottom:14px}
.picked{display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--gold);border-radius:var(--r);padding:12px 14px}
.picked svg{flex:none}
.picked strong{display:block}
.picked span{display:block;font-size:.9rem;color:var(--ink-2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;min-height:42px;font:inherit;font-size:.93rem;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);font-weight:600}

/* invitados */
.inv-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.inv-row .hint{margin:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qty button{width:42px;height:42px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.25rem;cursor:pointer}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:46px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty-lg button{width:52px;height:54px}
.qty-lg input{width:84px;height:54px;border:0;border-inline:1px solid var(--line);background:transparent;color:var(--ink);text-align:center;font:inherit;font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.qty-lg input::-webkit-outer-spin-button,.qty-lg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* paquetes */
.pkgs{display:grid;gap:14px}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.cmp-wrap{overflow-x:auto;margin:18px 0 0}.cmp{width:100%;border-collapse:collapse;font-size:.85rem}.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}.cmp td:first-child{text-align:left;color:var(--ink-2)}.cmp th{font-weight:700}
.intro .tarifas{margin:14px 0 0;max-width:none;}.tarifas{display:block;font-size:.8rem;color:var(--ink-2);line-height:1.35}.tarifas .tf-t{flex-basis:100%;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}.tarifas b{color:var(--ink);font-variant-numeric:tabular-nums}.tarifas .tf.on b{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}.tarifas .tf.on{font-weight:600}.tarifas small{font-size:.72rem;font-weight:400}
.subcat{margin:18px 0 6px;font-size:1rem;color:var(--ink)}
.aviso-ext{margin:18px 0 0;padding:12px 14px;border-radius:var(--r);background:var(--agave-soft);color:var(--ink);font-size:.92rem;line-height:1.45}
.pkg-xl{padding:24px 20px;border-color:var(--gold);background:linear-gradient(180deg,var(--surface),var(--agave-soft))}.pkg-xl h3{font-size:1.8rem}.pkg-xl .btn{padding-top:14px;padding-bottom:14px}
.pkg.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.badge{align-self:flex-start;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--agave);background:var(--agave-soft);padding:4px 8px;border-radius:6px}
.pkg h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.1;margin:0}
.pkg-desc{margin:0;color:var(--ink-2);font-size:.95rem}
.price{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.price .big{font-size:1.65rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.price .unit{color:var(--ink-2);font-size:.9rem}
.calc-line{margin:0;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm);font-size:.93rem;font-variant-numeric:tabular-nums}
.calc-line s{color:var(--ink-3)}
.note{display:block;font-size:.82rem;color:var(--ink-2);margin-top:2px}
details summary{cursor:pointer;color:var(--agave);font-weight:600;font-size:.93rem;padding-block:2px}
.incl{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem;color:var(--ink-2)}
.incl li{display:flex;gap:10px}
.incl li::before{content:"";flex:none;width:6px;height:6px;margin-top:.6em;border-radius:50%;background:var(--gold)}
.incl li.incl-h{font-weight:700;color:var(--ink);margin-top:10px}
.incl li.incl-h:first-child{margin-top:0}
.incl li.incl-h::before{content:none}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:inherit;font-weight:600;font-size:.97rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer}
.btn.sm{min-height:36px;padding:0 12px;font-size:.87rem;border-radius:10px}
.btn-main{background:var(--gold);color:var(--gold-ink)}
.btn-main:hover{filter:brightness(1.06)}
.btn-line{background:transparent;border-color:var(--ink-3);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-chosen{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-wa{background:var(--wa);color:var(--wa-ink);width:100%;min-height:52px;font-size:1.02rem}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:default}

/* extras */
.items{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.item.on{border-color:var(--gold);background:var(--gold-soft)}
.item h3{font-size:1rem;font-weight:700;margin:0 0 2px}
.item p{margin:0;font-size:.88rem;color:var(--ink-2)}
.item .tag{display:inline-block;margin:0 0 4px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink);font-size:.72rem;font-weight:700;letter-spacing:.02em}
.item .mas{margin:2px 0 0}
.item .mas summary{display:inline-block;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px 0;min-height:32px;list-style:none}
.item .mas summary::-webkit-details-marker{display:none}
.item .mas summary::after{content:'\00a0▾'}
.item .mas[open] summary::after{content:'\00a0▴'}
.item .mas p{padding:2px 0 6px}
.item .ip{margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.item .act{display:flex;justify-content:flex-end;flex-direction:column;align-items:flex-end;gap:6px}
.item .act .qty span{white-space:nowrap}
.tog{min-width:104px}
.item .opc{grid-column:1/-1;display:grid;gap:14px;border-top:1px solid var(--gold-line);padding-top:12px}
.item .opc-t{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.93rem;font-weight:700;color:var(--ink)}
.item .opc-n{font-weight:600;font-size:.82rem;color:var(--busy);white-space:nowrap}
.item .opc-n.ok{color:var(--agave)}
.opc .chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.opc .chip[aria-disabled="true"]{opacity:.45}
.opc .incl{margin:0}
.menu-t{padding:12px 16px;border-bottom:1px dashed var(--line);display:grid;gap:4px}
.menu-t .lbl{margin:0 0 2px}
.menu-t p{margin:0;font-size:.92rem}
.menu-t .falta{color:var(--busy);font-weight:600}
.menu-t .btn{justify-self:start;margin-top:6px}
.item-vid{grid-column:1/-1;display:flex;justify-content:center;margin-top:2px}
.item-vid video.h{aspect-ratio:16/9;width:min(100%,360px);object-fit:contain}
.item-vid video{display:block;width:min(100%,280px);aspect-ratio:1072/1924;object-fit:cover;border-radius:10px;background:#000}
.item-fotos{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scroll-snap-type:x mandatory}
.item-fotos a{flex:none;scroll-snap-align:start}
.item-fotos img{display:block;width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.item-fotos.una img{width:100%;max-width:260px;height:170px}
.prov-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--gold-line);border-radius:12px;padding:12px;margin-bottom:10px}
.prov-card img.logo{width:64px;height:64px;border-radius:10px;object-fit:cover}
.prov-card img.cover{grid-column:1/-1;width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.prov-card h3{margin:0;font-size:1rem}

oConEstacionamiento":2500,"detalle":"Va más allá del cuidado de vehículos que ya incluye tu evento. Con 80 invitados o más cuesta $2,500, porque ya tienes estacionamiento."},{"id":"cristaleria","categoria":"Loza y mantelería","nombre":"Cristalería y loza","descripcion":"Platos, vaso, cubiertos y servilleta de tela. Por evento.","precio":50,"unidad":"persona","incluidoEn":[],"autoEnPaquetes":["banquete","todo"],"activo":true,"pe":49.5,"detalle":"Plato base, plato trinche, plato postre, vaso highball, cubiertos y servilleta de tela. Ya incluida en Paquete banquete y Gala."},{"id":"copa","categoria":"Loza y mantelería","nombre":"Copa","descripcion":"Copa de cristal extra, por pieza","precio":15,"unidad":"cantidad","incluidoEn":[],"activo":true,"pe":13.2},{"id":"mantel-color","categoria":"Loza y mantelería","nombre":"Cubremantel en otro color","descripcion":"Guinda o verde: sin costo. Otro color: cargo por mesa.","precio":20,"unidad":"mesa","incluidoEn":[],"activo":true,"detalle":"Todo el mobiliario ya incluye mantel blanco. El cubremantel guinda o verde bandera es exclusivo de Kalli y no tiene costo, hasta 120 personas. Si el cliente quiere un color distinto a esos dos, este cargo aplica por cada mesa del evento, desde la primera mesa"}],"ocupadas":[{"fecha":"2026-09-05","nota":"Reservado"},{"fecha":"2026-09-12","nota":"Reservado"},{"fecha":"2026-09-19","nota":"Reservado"},{"fecha":"2026-09-27","nota":"Reservado"},{"fecha":"2026-10-03","nota":"Reservado"},{"fecha":"2026-10-24","nota":"Reservado"},{"fecha":"2026-10-31","nota":"Reservado"},{"fecha":"2026-12-05","nota":"Reservado"},{"fecha":"2026-12-20","nota":"Reservado"},{"fecha":"2027-02-05","nota":"Reservado"}],"apartados":[],"acomodos":[{"id":"recomendado","nombre":"Opción 1","descripcion":"","musicos":null,"mesas":[[3.25,3.25,7],[6.25,3.25,4],[9.25,3.25,1],[3.25,6.25,6],[6.25,6.25,3],[9.25,6.25,0],[3.25,9.25,8],[6.25,9.25,5],[9.25,9.25,2],[12.6,10.35,10],[15.6,10.35,12],[12.5,2.25,9],[15.5,2.25,11]]}],"proveedoresExt":[{"id":"bcs","nombre":"Bar Chill & Snacks","logo":"fotos/prov/bcs-logo.jpg","foto":"fotos/prov/bcs-barra.jpg","whatsapp":"","instagram":"","nota":"Barra de snacks dulces y salados. Todos los paquetes incluyen personal uniformado, barra y desechables. Servicio de hasta 2 horas o hasta terminar los productos. Puede haber costo adicional según la ubicación."},{"id":"mj","nombre":"Magic Jump","logo":"","foto":"","whatsapp":"","instagram":"","nota":"Renta de brincolines por 6 horas. Precios de lista del proveedor."},{"id":"mia","nombre":"MIA Snack & Bar","logo":"","foto":"fotos/prov/mia-barra.jpg","whatsapp":"","instagram":"","nota":"Snacks y bebidas por pieza, y paquetes. Precios de lista del proveedor, redondeados."}],"pagos":{},"testimonios":[{"texto":"Excelente lugar para cualquier evento. Todo salió muy bien, las instalaciones están muy bonitas, la comida estuvo deliciosa y el servicio fue excelente. Todo el personal fue muy atento y nos hizo sentir muy tranquilos durante el evento. Sin duda lo recomendaría y regresaría a celebrar otro evento.","autor":"K. F. B."},{"texto":"Excelente lugar para hacer de tus eventos un momento único! El servicio es excelente y la atención de Sergio en todo momento y en cada detalle de mi evento fue sin duda de mucha ayuda! Lo recomiendo ampliamente!","autor":"C. V."},{"texto":"Un espacio muy bonito y agradable para poder hacer sus fiestas y/o reuniones familiares. Los baños están limpios y preciosos.","autor":"C. R."}],"faq":[{"p":"¿Qué incluye la renta?","r":"La terraza por 5 horas + 1 hora de cortesía, mobiliario (mesa imperial, silla Versalles y mantel), mesa de regalos, suministro de baños, limpieza antes y después, personal de apoyo y cuidado de vehículos."},{"p":"¿Hasta qué hora puede durar mi evento?","r":"Tenemos permiso hasta las 3:00 am y no podemos pasar de esa hora. Si quieres más tiempo, cada hora extra cuesta $2,000, siempre dentro de ese límite."},{"p":"¿Cuántas personas caben?","r":"Hasta 130 invitados bajo techo (hasta 139 usando algunas mesas de 11). Desde 140 se agrega toldo en el jardín, con capacidad máxima de 250."},{"p":"¿Qué pasa si llueve?","r":"El área principal es techada (17 × 12 m). Para eventos grandes, las mesas del jardín van bajo toldo."},{"p":"¿Puedo llevar mi comida y mis bebidas?","r":"Sí, puedes llevar tu propia comida y bebidas. Si necesitas hielo, lo vendemos en la terraza."},{"p":"¿Puedo traer mis propios proveedores (DJ, decorador, pastel)?","r":"Sí. Pueden entrar a montar desde 2 horas antes del evento y tienen de 30 a 45 minutos para desmontar al terminar."},{"p":"¿Cuánto es el anticipo y cuándo liquido?","r":"Para apartar pagas el 25 % del total; el depósito de garantía ya va incluido en ese total. Puedes abonar cuando quieras y el total se liquida 21 días (3 semanas) antes del evento. Si faltan 21 días o menos para tu evento, se paga el total al apartar. Pagos por transferencia SPEI, sin comisión."},{"p":"¿Me regresan el depósito de garantía?","r":"Sí, hasta 48 horas después del evento. Si hubo daños, se descuentan del depósito según el reglamento; si no alcanza, la diferencia se paga aparte."},{"p":"¿Qué pasa si cancelo o cambio de fecha?","r":"El anticipo y los pagos no son reembolsables. Los cambios de fecha dependen de la disponibilidad y de las tarifas vigentes al pedirlo."},{"p":"¿Hay estacionamiento?","r":"Sí. Tenemos un estacionamiento pequeño con vigilante. En eventos de 80 personas o más habilitamos un espacio junto a la terraza para acomodar más autos."},{"p":"¿Puedo visitar la terraza antes?","r":"Claro, con todo gusto. Agenda tu visita con cita previa por WhatsApp o vía telefónica."},{"p":"¿Aceptan mascotas?","r":"Preferimos que no. Si es necesario, solo de raza pequeña y máximo 2, y sus dueños se hacen responsables de sus desechos y de cualquier daño."},{"p":"¿Puedo tener música en vivo?","r":"Sí, respetando los límites de ruido del municipio de Tlajomulco. El grupo o proveedor de sonido y el contratante son responsables de cualquier multa por exceso de ruido."},{"p":"¿Se permite pirotecnia o confeti?","r":"Sí, de todo tipo, en el área abierta y lejos del techo y los toldos. Tú y tu proveedor son responsables de los permisos y de **cualquier daño**."},{"p":"¿Facturan?","r":"Sí. Nuestros precios no incluyen IVA: si necesitas factura, se agrega el 16 %. Pídela al apartar tu fecha."},{"p":"¿Qué necesito para firmar el contrato?","r":"Tu identificación oficial vigente (INE)."}],"historial":[]}</script>

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function notasArr(v){if(Array.isArray(v))return v.filter(Boolean);return v?[v]:[];}
function paqueteConCristaleria(p){
  if(!p)return false;
  if(p.id==='todo')return true;
  var it=item('cristaleria');
  return !!(it&&it.autoEnPaquetes&&it.autoEnPaquetes.indexOf(p.id)>-1);
}
function depositoExtraCristaleria(p,inv){
  var pct=+D.negocio.depositoCristaleriaPct||0;
  if(!pct||!(paqueteConCristaleria(p)||(typeof S!=='undefined'&&S&&S.items&&S.items.cristaleria)))return 0;
  var it=item('cristaleria'),precio=it?precioDe(it):0;
  return Math.round(precio*(+inv||0)*pct/100);
}
function depositoTotal(p,inv){return (+D.negocio.depositoGarantia||0)+depositoExtraCristaleria(p,inv);}
function depositoTexto(incluido,p,inv){
  var m=depositoTotal(p,inv),extra=depositoExtraCristaleria(p,inv);
  if(!m)return '';
  var detalle=extra?' (incluye '+fmt(extra)+' adicional por cristalería, proporcional a tus invitados)':'';
  return incluido?'El total ya incluye tu depósito de garantía de '+fmt(m)+detalle+', reembolsable hasta 48 horas después del evento, una vez que se revise que todo esté en orden.':'+ depósito de garantía de '+fmt(m)+', reembolsable 48 h después del evento.';
}
function fmt(n){n=Math.round(+n||0);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('es-MX');}
function signed(p){return (p>0?'+':'−')+Math.abs(p);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1);}
function fechaLarga(s){var d=parse(s);return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();}
function fechaCorta(s){var d=parse(s);return DIAS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(k){return k+Math.random().toString(36).slice(2,7);}
function telVisible(w){var s=String(w||'').replace(/\D/g,'').slice(-10);return s.length===10?s.slice(0,2)+' '+s.slice(2,6)+' '+s.slice(6):s;}
var hoy=new Date();hoy.setHours(0,0,0,0);
function capacidad(){return Math.max(1,+D.negocio.capacidad||250);}
function minFecha(){var d=new Date(hoy);d.setDate(d.getDate()+(+D.negocio.diasMinimos||0));return d;}
function maxFecha(){return new Date(hoy.getFullYear(),hoy.getMonth()+(+D.negocio.mesesVisibles||12)+1,0);}
function ocupadaEn(data,s){return data.ocupadas.some(function(o){return o.fecha===s;});}
function apartadaActiva(data,s){var now=new Date();return (data.apartados||[]).some(function(a){return a.fecha===s&&new Date(a.vence)>now;});}
function disponible(s){var d=parse(s);return d>=minFecha()&&d<=maxFecha()&&!ocupadaEn(D,s)&&!apartadaActiva(D,s);}
function diasHasta(fechaStr){return Math.round((parse(fechaStr)-hoy)/86400000);}
function calificaApartado(fechaStr){return !!fechaStr&&diasHasta(fechaStr)>=(+D.reglas.diasMinimosApartado||21);}
function tierFecha(fechaStr){
  if(!fechaStr)return 'cerca';
  var d=diasHasta(fechaStr),lejos=+D.reglas.diasMinimosApartado||21,media=+D.reglas.diasLiquidacionTotal||7;
  if(d>lejos)return 'lejos';
  if(d>=media)return 'media';
  return 'cerca';
}
function puedeReservar(fechaStr){return tierFecha(fechaStr)!=='cerca';}
function requierePagoTotal(fechaStr){return tierFecha(fechaStr)!=='lejos';}
function gcalStamp(dt){return String(dt.getFullYear())+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0')+'T'+String(dt.getHours()).padStart(2,'0')+String(dt.getMinutes()).padStart(2,'0')+'00';}
function gcalStampDia(d){return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}

/* Descarga del PDF: dentro de claude.ai el navegador bloquea doc.save(); se usa la capacidad "downloads" (el usuario confirma). Fuera de claude.ai, descarga normal. */
async function guardarPDF(doc,nombre){
  var dl=null;
  try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(!dl){doc.save(nombre);return 'saved';}
  try{await dl.save({filename:nombre,data:doc.output('blob')});return 'saved';}
  catch(e){var c=e&&e.code;if(c==='declined')return 'declined';if(c==='rate_limited')throw new Error('ya hay una descarga esperando tu confirmación.');throw new Error('la descarga no está disponible aquí ('+(c||'error')+').');}
}
function cargarJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(jsPDFReady)return jsPDFReady;
  jsPDFReady=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=JSPDF_URL;
    s.onload=function(){window.jspdf&&window.jspdf.jsPDF?res(window.jspdf.jsPDF):rej(new Error('jsPDF no cargó'));};
    s.onerror=function(){rej(new Error('No se pudo cargar la librería de PDF. Revisa tu conexión.'));};
    document.head.appendChild(s);

}

function arrastreAcomodo(e){
  var g=e.target.closest&&e.target.closest('[data-mi]');if(!g||!A||A.tab!=='acomodo')return;
  var svg=g.ownerSVGElement,ac=A.draft.acomodos[A.acSel||0],i=+g.dataset.mi,m=ac&&ac.mesas[i],ctm=svg&&svg.getScreenCTM();
  if(!m||!ctm)return;
  e.preventDefault();
  var inv=ctm.inverse();
  function pt(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(inv);}
  var p0=pt(e),ox=m[0],oy=m[1],nx=ox,ny=oy;
  function mv(ev){var p=pt(ev);nx=Math.max(1.25,Math.min(PLANO.W-1.25,Math.round((ox+p.x-p0.x)*4)/4));ny=Math.max(1.25,Math.min(PLANO.H-1.25,Math.round((oy+p.y-p0.y)*4)/4));g.setAttribute('transform','translate('+pf(nx-ox)+' '+pf(ny-oy)+')');}
  function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);if(nx!==ox||ny!==oy){m[0]=nx;m[1]=ny;recalcPrio(ac);marcarCambio();}renderAdmin(true);}
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
var ZONAS_MESA=[{n:'la barra de bebidas',x1:.3,y1:0,x2:4.3,y2:.72},{n:'la zona de postres',x1:0,y1:1.3,x2:.87,y2:6.1}];
function mesaEnZona(x,y){return ZONAS_MESA.find(function(z){return x+1.25>z.x1&&x-1.25<z.x2&&y+1.25>z.y1&&y-1.25<z.y2;});}
function lugarLibreMesa(ac){
  for(var y=1.25;y<=PLANO.H-1.25;y+=.5)for(var x=1.25;x<=PLANO.W-1.25;x+=.5){
    if(x+1.25>11&&x-1.25<15&&y+1.25>3.75&&y-1.25<8.25)continue;
    if(x+1.25>15&&y+1.25>3.75&&y-1.25<8.25)continue;
    if(mesaEnZona(x,y))continue;
    if(ac.mesas.every(function(m){return Math.hypot(m[0]-x,m[1]-y)>=2.6;}))return [x,y];
  }

}

  var fi=String(info||'').split('|'),datos={};
  var meta={};
  if(info){if(/^\d{1,2}:\d{2}$/.test(fi[0]))datos.horario=fi[0];if(+fi[1]>0)datos.horas=+fi[1];if(+fi[2]>0)datos.invitados=+fi[2];if(fi[3])datos.paquete=String(fi[3]).slice(0,30);
    if(fi.length>=8){meta={origen:String(fi[5]||'').slice(0,30),tipo:String(fi[6]||'').slice(0,30),total:Math.max(0,Math.min(10000000,+fi[7]||0))};}}
  /* historial para Estadísticas: sin nombres ni teléfonos */
  d.historial=Array.isArray(d.historial)?d.historial:[];
  var hx=d.historial.findIndex(function(h){return h.folio&&h.folio===nota;});
  var reg={folio:nota||'',fecha:fecha,creado:new Date().toISOString(),origen:meta.origen||'',tipo:meta.tipo||'',invitados:datos.invitados||0,paquete:datos.paquete||'',total:meta.total||0,estado:'apartado'};
  if(hx>=0){reg.creado=d.historial[hx].creado||reg.creado;if(d.historial[hx].estado==='confirmado')reg.estado='confirmado';d.historial[hx]=reg;}else d.historial.push(reg);
  if(ex>=0){d.apartados[ex].vence=vence;if(nota){d.apartados[ex].nota=nota;d.apartados[ex].folio=nota;}if(nombres.length)d.apartados[ex].extras=mezclarExtras(d.apartados[ex].extras,nombres);Object.assign(d.apartados[ex],datos);}
  else{d.apartados.push(Object.assign({fecha:fecha,nota:nota||'',folio:nota||'',creado:new Date().toISOString(),vence:vence,extras:mezclarExtras([],nombres)},datos));}
  marcarCambio();renderAdmin(true);
  if(JSON.stringify(d)!==antes)autoPublicar();
  A.status='Apartado el '+fechaLarga(fecha)+(nota?' para el folio '+nota:'')+' por '+horas+' h.';refreshFoot();
}
function updHeaderBtn(){var row=app.querySelector('.brand-btns');if(row&&!row.querySelector('[data-admin]'))row.insertAdjacentHTML('afterbegin','<button type="button" class="adm-btn" data-admin>Admin</button>');}

render();
iniciarAdmin();
})();
</script>
